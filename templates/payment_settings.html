<!DOCTYPE html>

<html>

<head>

<link rel="stylesheet" href="/static/style.css">

<title>Payment Settings</title>

</head>

<body>

  <div class="settings-container">
    

<h1>💳 Payment Settings</h1>

<form
action="/save_payment_settings"
method="post"
enctype="multipart/form-data">

<label>

Payment Method

</label>

<br><br>

<select name="payment_mode">

<option value="UPI"
{% if setting and setting.payment_mode == "UPI" %}selected{% endif %}>
UPI
</option>

<option value="PhonePe"
{% if setting and setting.payment_mode == "PhonePe" %}selected{% endif %}>
PhonePe
</option>

<option value="Google Pay"
{% if setting and setting.payment_mode == "Google Pay" %}selected{% endif %}>
Google Pay
</option>

<option value="Paytm"
{% if setting and setting.payment_mode == "Paytm" %}selected{% endif %}>
Paytm
</option>

<option value="Bank Account"
{% if setting and setting.payment_mode == "Bank Account" %}selected{% endif %}>
Bank Account
</option>

<option value="PayPal"
{% if setting and setting.payment_mode == "PayPal" %}selected{% endif %}>
PayPal
</option>

<option value="Wise"
{% if setting and setting.payment_mode == "Wise" %}selected{% endif %}>
Wise
</option>

<option value="Payoneer"
{% if setting and setting.payment_mode == "Payoneer" %}selected{% endif %}>
Payoneer
</option>

<option value="Cash"
{% if setting and setting.payment_mode == "Cash" %}selected{% endif %}>
Cash
</option>

<option value="Other"
{% if setting and setting.payment_mode == "Other" %}selected{% endif %}>
Other
</option>

</select>

<br><br>

<input

type="text"

name="payment_info"

placeholder="UPI ID / Phone Number / Bank Details"

value="{{ setting.payment_info if setting else '' }}">

<br><br>

<label>Upload QR Code (Optional)</label>

<br><br>

{% if setting and setting.qr_image_data %}

<img
src="/payment_qr/{{ session['user_id'] }}"
width="220">

<br><br>

{% endif %}

<input
type="file"
name="qr_image">

  <button type="submit">

💾 Save Payment Settings

</button>

</form>

<hr>

<h2>

Don't have a digital wallet?

</h2>

<a href="https://play.google.com/store/apps/details?id=com.phonepe.app">

<button type="button">

📱 Download PhonePe

</button>

</a>

<br><br>

<a href="https://play.google.com/store/apps/details?id=com.google.android.apps.nbu.paisa.user">

<button type="button">

📱 Download Google Pay

</button>

</a>

<br><br>

<a href="https://play.google.com/store/apps/details?id=net.one97.paytm">

<button type="button">

📱 Download Paytm

</button>

</a>

<br><br>

<a href="https://play.google.com/store/apps/details?id=in.org.npci.upiapp">

<button type="button">

📱 Download BHIM UPI

</button>

</a>

<br><br>

    <a href="https://www.paypal.com/" target="_blank">
    <button type="button">🌍 PayPal</button>
    </a>

    <br><br>

    <a href="https://wise.com/" target="_blank">
    <button type="button">🌍 Wise</button>
    </a>

    <br><br>

    <a href="https://www.payoneer.com/" target="_blank">
    <button type="button">🌍 Payoneer</button>
    </a>

  </div>

</body>

</html>
